short_bio: >-
  <p>
    I am a Researcher working on Multimodal Large Language Models (MLLMs), with a particular focus on visual token efficiency and efficient deep learning architectures for practical computing platforms.
  </p>
  <p>
    With over a decade of research experience—including a Ph.D. from <a href="https://www.yonsei.ac.kr/en_sc/" target="_blank">Yonsei University</a> (2018) under the supervision of Prof. Jong-Seok Lee at the <a href="https://mcml.yonsei.ac.kr/" target="_blank">MCML Group</a>—my technical background spans perceptual image and video quality processing, AI-based camera ISP, generative vision models, and multimodal architectures. By bridging deep expertise in perceptual visual processing with efficient multimodal AI, I strive to advance high-fidelity, resource-conscious intelligent systems.
  </p>
  <p class="mb-2 font-weight-bold" style="font-size: 1.05rem;">Research Interests</p>
  <ul class="mb-0" style="columns: 2; -webkit-columns: 2; -moz-columns: 2;">
    <li>Multimodal Large Language Models (MLLMs)</li>
    <li>Visual Token Efficiency</li>
    <li>Efficient Deep Learning Architectures</li>
    <li>AI-based Camera ISP & Perceptual Image/Video Processing</li>
    <li>Perceptual Quality Assessment (IQA / VQA)</li>
    <li>Generative Vision Models</li>
  </ul>
